<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="720" height="400" class="bg"/><rect x="170" y="20" width="380" height="50" rx="25" class="tint2 s"/><text x="360" y="45" text-anchor="middle" dominant-baseline="middle" class="t-s b">大手の通信事業者（互いに直接つながる）</text><rect x="90" y="140" width="150" height="50" rx="6" class="tint s"/><text x="165.0" y="165.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">ISP A</text><rect x="480" y="140" width="150" height="50" rx="6" class="tint s"/><text x="555.0" y="165.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">ISP B</text><rect x="295" y="140" width="130" height="50" rx="6" class="accT s"/><text x="360.0" y="157.0" text-anchor="middle" dominant-baseline="middle" class="t-xs b">IX</text><text x="360.0" y="173.0" text-anchor="middle" dominant-baseline="middle" class="t-xs b">（相互接続点）</text><line x1="240" y1="165" x2="295" y2="165" class="s"/><line x1="425" y1="165" x2="480" y2="165" class="s"/><line x1="165" y1="140" x2="250" y2="70" class="s"/><line x1="555" y1="140" x2="470" y2="70" class="s"/><text x="176" y="92" text-anchor="end" dominant-baseline="middle" class="t-xs lbl">費用を払って</text><text x="176" y="108" text-anchor="end" dominant-baseline="middle" class="t-xs lbl">つないでもらう</text><text x="360" y="212" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">対等な事業者どうしは IX で直接交換する</text><rect x="20" y="270" width="130" height="46" rx="4" class="bg s"/><text x="85.0" y="293.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">家庭</text><line x1="85" y1="270" x2="165" y2="190" class="sm"/><rect x="180" y="270" width="130" height="46" rx="4" class="bg s"/><text x="245.0" y="293.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">大学の LAN</text><line x1="245" y1="270" x2="165" y2="190" class="sm"/><rect x="410" y="270" width="130" height="46" rx="4" class="bg s"/><text x="475.0" y="293.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">データセンター</text><line x1="475" y1="270" x2="555" y2="190" class="sm"/><rect x="570" y="270" width="130" height="46" rx="4" class="bg s"/><text x="635.0" y="293.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">企業</text><line x1="635" y1="270" x2="555" y2="190" class="sm"/><text x="475" y="332" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">Web や生成AI のサーバ</text><text x="360" y="366" text-anchor="middle" dominant-baseline="middle" class="t-s b">中央の管理者はいない。独立に運営される多数のネットワークがつながっている</text><text x="360" y="390" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">海外とは海底ケーブルでつながる</text></svg>

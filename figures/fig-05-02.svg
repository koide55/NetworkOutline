<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="720" height="380" class="bg"/><rect x="20" y="150" width="150" height="60" rx="6" class="tint s"/><text x="95.0" y="180.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">ブラウザ A</text><rect x="550" y="150" width="150" height="60" rx="6" class="tint s"/><text x="625.0" y="180.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">ブラウザ B</text><rect x="270" y="20" width="180" height="50" rx="4" class="bg s"/><text x="360.0" y="37.0" text-anchor="middle" dominant-baseline="middle" class="t-xs b">シグナリングサーバ</text><text x="360.0" y="53.0" text-anchor="middle" dominant-baseline="middle" class="t-xs b">（Web サーバ）</text><path d="M95,150 C95,90 180,48 266,45" class="sm" marker-end="url(#am)"/><path d="M625,150 C625,90 540,48 454,45" class="sm" marker-end="url(#am)"/><text x="180" y="100" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">① つなぎ方の情報を</text><text x="180" y="116" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">交換する（HTTP など）</text><rect x="290" y="270" width="140" height="44" rx="4" class="tint2 s"/><text x="360.0" y="292.0" text-anchor="middle" dominant-baseline="middle" class="t-xs b">STUN / TURN</text><text x="360" y="330" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">② 外から見えるアドレスを調べる</text><text x="360" y="346" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">直接つながらないときは中継してもらう</text><line x1="170" y1="200" x2="290" y2="280" class="sm dash"/><line x1="550" y1="200" x2="430" y2="280" class="sm dash"/><line x1="174" y1="172" x2="546" y2="172" class="sa" marker-end="url(#aa)"/><line x1="546" y1="190" x2="174" y2="190" class="sa" marker-end="url(#aa)"/><text x="360" y="160" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">③ 映像・音声・データを直接送り合う</text><text x="360" y="212" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">暗号化は必須</text></svg>

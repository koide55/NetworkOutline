<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="720" height="360" class="bg"/><rect x="20" y="130" width="150" height="76" rx="6" class="tint s"/><text x="95.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">あなたの</text><text x="95.0" y="176.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">プログラム</text><rect x="540" y="108" width="160" height="120" rx="6" class="accT s"/><text x="620" y="132" text-anchor="middle" dominant-baseline="middle" class="t-s b">LLM の API サーバ</text><text x="620" y="150" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">データセンター</text><rect x="566" y="166" width="22" height="18" class="bg s"/><rect x="594" y="166" width="22" height="18" class="bg s"/><rect x="622" y="166" width="22" height="18" class="bg s"/><rect x="650" y="166" width="22" height="18" class="bg s"/><rect x="566" y="190" width="22" height="18" class="bg s"/><rect x="594" y="190" width="22" height="18" class="bg s"/><rect x="622" y="190" width="22" height="18" class="bg s"/><rect x="650" y="190" width="22" height="18" class="bg s"/><text x="620" y="222" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">GPU</text><rect x="290" y="22" width="140" height="38" rx="4" class="tint2 s"/><text x="360.0" y="41.0" text-anchor="middle" dominant-baseline="middle" class="t-s b">DNS</text><path d="M120,130 C120,60 200,41 286,41" class="sm dash" marker-end="url(#am)"/><text x="160" y="68" text-anchor="start" dominant-baseline="middle" class="t-xs lbl">① 名前を引く</text><rect x="184" y="112" width="340" height="112" rx="14" class="none sa dash"/><text x="354" y="102" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">② TLS で相手を確かめ、暗号化する（HTTPS）</text><line x1="196" y1="146" x2="532" y2="146" class="s" marker-end="url(#a)"/><text x="354" y="136" text-anchor="middle" dominant-baseline="middle" class="t-xs">③ POST ＋ JSON（会話の履歴・API キー）</text><line x1="532" y1="192" x2="196" y2="192" class="s" marker-end="url(#a)"/><text x="354" y="182" text-anchor="middle" dominant-baseline="middle" class="t-xs">④ 200 OK ＋ JSON（答え・使ったトークン数）</text><text x="354" y="254" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">stream を指定すると、④ は SSE で少しずつ届く（画面に文字が順に出る理由）</text><text x="360" y="300" text-anchor="middle" dominant-baseline="middle" class="t-s b">第2〜4回で学んだ DNS・TLS・HTTP・JSON が、そのまま使われている</text><text x="360" y="324" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">巨大なモデルは手元では動かないので、GPU を持つデータセンターに要求を送る</text></svg>

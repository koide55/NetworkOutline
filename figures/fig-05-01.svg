<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="720" height="400" class="bg"/><rect x="30" y="300" width="660" height="40" rx="20" class="tint2 s"/><text x="360" y="320" text-anchor="middle" dominant-baseline="middle" class="t-xs b">インターネット（実際の経路）</text><line x1="120" y1="90" x2="330" y2="60" class="sm dash"/><line x1="330" y1="60" x2="560" y2="100" class="sm dash"/><line x1="120" y1="90" x2="220" y2="210" class="sm dash"/><line x1="220" y1="210" x2="480" y2="220" class="sm dash"/><line x1="330" y1="60" x2="480" y2="220" class="sm dash"/><line x1="560" y1="100" x2="480" y2="220" class="sm dash"/><rect x="64" y="66" width="112" height="48" rx="6" class="bg s"/><text x="80" y="82" text-anchor="middle" dominant-baseline="middle" class="t-xs b">A</text><rect x="90" y="88" width="16" height="16" rx="2" class="accT s"/><text x="98" y="97" text-anchor="middle" dominant-baseline="middle" class="t-xs">1</text><rect x="110" y="88" width="16" height="16" rx="2" class="accT s"/><text x="118" y="97" text-anchor="middle" dominant-baseline="middle" class="t-xs">2</text><rect x="130" y="88" width="16" height="16" rx="2" class="bg sm"/><rect x="150" y="88" width="16" height="16" rx="2" class="bg sm"/><line x1="120" y1="114" x2="120" y2="296" class="sm dot"/><rect x="274" y="36" width="112" height="48" rx="6" class="bg s"/><text x="290" y="52" text-anchor="middle" dominant-baseline="middle" class="t-xs b">B</text><rect x="300" y="58" width="16" height="16" rx="2" class="bg sm"/><rect x="320" y="58" width="16" height="16" rx="2" class="accT s"/><text x="328" y="67" text-anchor="middle" dominant-baseline="middle" class="t-xs">2</text><rect x="340" y="58" width="16" height="16" rx="2" class="accT s"/><text x="348" y="67" text-anchor="middle" dominant-baseline="middle" class="t-xs">3</text><rect x="360" y="58" width="16" height="16" rx="2" class="accT s"/><text x="368" y="67" text-anchor="middle" dominant-baseline="middle" class="t-xs">4</text><line x1="330" y1="84" x2="330" y2="296" class="sm dot"/><rect x="504" y="76" width="112" height="48" rx="6" class="bg s"/><text x="520" y="92" text-anchor="middle" dominant-baseline="middle" class="t-xs b">C</text><rect x="530" y="98" width="16" height="16" rx="2" class="accT s"/><text x="538" y="107" text-anchor="middle" dominant-baseline="middle" class="t-xs">1</text><rect x="550" y="98" width="16" height="16" rx="2" class="bg sm"/><rect x="570" y="98" width="16" height="16" rx="2" class="bg sm"/><rect x="590" y="98" width="16" height="16" rx="2" class="accT s"/><text x="598" y="107" text-anchor="middle" dominant-baseline="middle" class="t-xs">4</text><line x1="560" y1="124" x2="560" y2="296" class="sm dot"/><rect x="164" y="186" width="112" height="48" rx="6" class="bg s"/><text x="180" y="202" text-anchor="middle" dominant-baseline="middle" class="t-xs b">D</text><rect x="190" y="208" width="16" height="16" rx="2" class="bg sm"/><rect x="210" y="208" width="16" height="16" rx="2" class="bg sm"/><rect x="230" y="208" width="16" height="16" rx="2" class="accT s"/><text x="238" y="217" text-anchor="middle" dominant-baseline="middle" class="t-xs">3</text><rect x="250" y="208" width="16" height="16" rx="2" class="bg sm"/><line x1="220" y1="234" x2="220" y2="296" class="sm dot"/><rect x="424" y="196" width="112" height="48" rx="6" class="bg s"/><text x="440" y="212" text-anchor="middle" dominant-baseline="middle" class="t-xs b">E</text><rect x="450" y="218" width="16" height="16" rx="2" class="accT s"/><text x="458" y="227" text-anchor="middle" dominant-baseline="middle" class="t-xs">1</text><rect x="470" y="218" width="16" height="16" rx="2" class="accT s"/><text x="478" y="227" text-anchor="middle" dominant-baseline="middle" class="t-xs">2</text><rect x="490" y="218" width="16" height="16" rx="2" class="accT s"/><text x="498" y="227" text-anchor="middle" dominant-baseline="middle" class="t-xs">3</text><rect x="510" y="218" width="16" height="16" rx="2" class="bg sm"/><line x1="480" y1="244" x2="480" y2="296" class="sm dot"/><line x1="300" y1="76" x2="176" y2="84" class="sa" marker-end="url(#aa)"/><text x="232" y="64" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">片 3 を渡す</text><line x1="424" y1="210" x2="270" y2="210" class="sa" marker-end="url(#aa)"/><text x="347" y="198" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">片 1・2 を渡す</text><text x="640" y="168" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">点線：ピアどうしの</text><text x="640" y="184" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">論理的なつながり</text><text x="360" y="370" text-anchor="middle" dominant-baseline="middle" class="t-xs b">ファイルを小片に分け、持っている片を互いに配り合う。参加者が増えるほど配る側も増える</text><text x="360" y="392" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">インターネットの上に、アプリケーションのための網（オーバレイネットワーク）を築いている</text></svg>

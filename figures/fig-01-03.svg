<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="720" height="380" class="bg"/><rect x="20" y="60" width="220" height="180" rx="8" class="tint s"/><text x="130" y="82" text-anchor="middle" dominant-baseline="middle" class="t-s b">あなたの PC</text><text x="130" y="102" text-anchor="middle" dominant-baseline="middle" class="t-xs m lbl">192.168.1.23</text><rect x="40" y="130" width="180" height="50" rx="4" class="accT s"/><text x="130.0" y="147.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ブラウザ</text><text x="130.0" y="163.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ポート 50123（一時的）</text><rect x="470" y="40" width="230" height="250" rx="8" class="tint s"/><text x="585" y="62" text-anchor="middle" dominant-baseline="middle" class="t-s b">サーバ</text><text x="585" y="82" text-anchor="middle" dominant-baseline="middle" class="t-xs m lbl">203.0.113.10</text><rect x="490" y="100" width="190" height="46" rx="4" class="accT s"/><text x="585.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">Web サーバ</text><text x="585.0" y="131.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ポート 443</text><rect x="490" y="160" width="190" height="46" rx="4" class="bg s"/><text x="585.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">メールサーバ</text><text x="585.0" y="191.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ポート 587</text><rect x="490" y="220" width="190" height="46" rx="4" class="bg s"/><text x="585.0" y="235.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">SSH サーバ</text><text x="585.0" y="251.0" text-anchor="middle" dominant-baseline="middle" class="t-xs">ポート 22</text><line x1="222" y1="155" x2="486" y2="123" class="sa" marker-end="url(#aa)"/><text x="354" y="124" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">宛先 203.0.113.10 の 443 番へ</text><text x="354" y="160" text-anchor="middle" dominant-baseline="middle" class="t-xs">IP アドレスで計算機を選び</text><text x="354" y="178" text-anchor="middle" dominant-baseline="middle" class="t-xs">ポート番号でアプリを選ぶ</text><text x="360" y="324" text-anchor="middle" dominant-baseline="middle" class="t-xs b">通信は5つ組で区別する：送信元の IP とポート・宛先の IP とポート・TCP か UDP か</text><text x="360" y="350" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">だから1台のサーバで Web とメールを同時に動かせ、ブラウザのタブを何枚開いても混ざらない</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img"><style>
svg { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
/* 線のクラスを先に置く。fill: none を持たせているのは、線だけの図形が
   既定の黒で塗られないようにするため。ただしこれを塗りのクラスより
   後に書くと、同じ詳細度なので後勝ちで cls='tint2 s' の塗りが消える。
   実際そうなっており、全図で塗りが出ていなかった（2026-09-22 に修正）。 */
.s    { stroke: #16191d; stroke-width: 1.6; fill: none; }
.s2   { stroke: #16191d; stroke-width: 2.6; fill: none; }
.sm   { stroke: #5f6672; stroke-width: 1.2; fill: none; }
.sa   { stroke: #0b5cad; stroke-width: 2.2; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot  { stroke-dasharray: 1.5 3; }
/* 塗りのクラス。線のクラスより後に置くことで cls='tint2 s' が塗られる */
.bg   { fill: #ffffff; }
.ink  { fill: #16191d; }
.mut  { fill: #5f6672; }
.tint { fill: #eef1f5; }
.tint2{ fill: #dde4ec; }
.acc  { fill: #0b5cad; }
.accT { fill: #d9e6f4; }
.none { fill: none; }
text  { fill: #16191d; font-size: 14px; }
.t-s  { font-size: 12px; }
.t-xs { font-size: 10.5px; }
.t-l  { font-size: 17px; }
.t-xl { font-size: 21px; }
.b    { font-weight: 700; }
.i    { font-style: italic; }
.m    { font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl  { fill: #5f6672; }
@media (prefers-color-scheme: dark) {
  .bg   { fill: #14171b; }
  .ink  { fill: #e8ebef; }
  .mut  { fill: #9aa3b0; }
  .tint { fill: #232830; }
  .tint2{ fill: #2e343d; }
  .acc  { fill: #6ab0f3; }
  .accT { fill: #1e2c3c; }
  .s, .s2 { stroke: #e8ebef; }
  .sm   { stroke: #9aa3b0; }
  .sa   { stroke: #6ab0f3; }
  text  { fill: #e8ebef; }
  .lbl  { fill: #9aa3b0; }
}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
 <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mut"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
   <circle cx="5" cy="5" r="3.5" class="bg s"/></marker>
</defs>
<rect width="720" height="430" class="bg"/><rect x="30.0" y="20" width="160" height="36" rx="4" class="tint s"/><text x="110.0" y="38.0" text-anchor="middle" dominant-baseline="middle" class="t-xs b">利用者のブラウザ</text><line x1="110" y1="56" x2="110" y2="350" class="sm dash"/><rect x="300.0" y="20" width="160" height="36" rx="4" class="tint s"/><text x="380.0" y="38.0" text-anchor="middle" dominant-baseline="middle" class="t-xs b">Web アプリ</text><line x1="380" y1="56" x2="380" y2="350" class="sm dash"/><rect x="540.0" y="20" width="160" height="36" rx="4" class="tint s"/><text x="620.0" y="38.0" text-anchor="middle" dominant-baseline="middle" class="t-xs b">攻撃者</text><line x1="620" y1="56" x2="620" y2="350" class="sm dash"/><line x1="114" y1="92" x2="376" y2="92" class="s" marker-end="url(#a)"/><text x="245.0" y="83" text-anchor="middle" dominant-baseline="middle" class="t-xs">POST /login（ID とパスワード）</text><line x1="376" y1="134" x2="114" y2="134" class="s" marker-end="url(#a)"/><text x="245.0" y="125" text-anchor="middle" dominant-baseline="middle" class="t-xs">Set-Cookie: session=abc123</text><line x1="114" y1="176" x2="376" y2="176" class="s" marker-end="url(#a)"/><text x="245.0" y="167" text-anchor="middle" dominant-baseline="middle" class="t-xs">GET /mypage　Cookie: session=abc123</text><line x1="376" y1="218" x2="114" y2="218" class="s" marker-end="url(#a)"/><text x="245.0" y="209" text-anchor="middle" dominant-baseline="middle" class="t-xs">利用者のマイページ</text><path d="M118,240 C200,268 520,250 612,262" class="sa dash" marker-end="url(#aa)"/><text x="360" y="234" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">abc123 が漏れる（XSS で読まれる、平文の通信を盗聴される）</text><line x1="616" y1="300" x2="384" y2="300" class="sa" marker-end="url(#aa)"/><text x="500.0" y="291" text-anchor="middle" dominant-baseline="middle" class="t-xs acc b">GET /mypage　Cookie: session=abc123</text><line x1="384" y1="336" x2="616" y2="336" class="s" marker-end="url(#a)"/><text x="500.0" y="327" text-anchor="middle" dominant-baseline="middle" class="t-xs">利用者のマイページが見える</text><text x="360" y="382" text-anchor="middle" dominant-baseline="middle" class="t-s b">サーバは「その Cookie を持っている人」を本人とみなす</text><text x="360" y="406" text-anchor="middle" dominant-baseline="middle" class="t-xs lbl">HTTP はステートレス（第3回）。ログイン状態は Cookie の値だけで表されている</text></svg>
